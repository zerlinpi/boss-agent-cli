name: Windows Recruiter Boundaries

on:
  push:
    branches: [master]
    paths:
      - "src/boss_agent_cli/ai/**"
      - "src/boss_agent_cli/auth/browser.py"
      - "src/boss_agent_cli/desktop.py"
      - "src/boss_agent_cli/web/**"
      - "src/boss_agent_cli/commands/ai_config_safety.py"
      - "src/boss_agent_cli/commands/register.py"
      - "scripts/build-recruiter-exe.ps1"
      - "build-recruiter-exe.bat"
      - "tests/test_ai_config_*.py"
      - "tests/test_auth_browser.py"
      - "tests/test_auth_browser_channels.py"
      - "tests/test_recruiter_ai_config_safety.py"
      - "tests/test_recruiter_analytics_safety.py"
      - "tests/test_recruiter_desktop.py"
      - "tests/test_recruiter_exe_packaging.py"
      - "tests/test_recruiter_request_boundary.py"
      - "tests/test_recruiter_web_guided_setup.py"
      - ".github/workflows/windows-recruiter-boundaries.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/boss_agent_cli/ai/**"
      - "src/boss_agent_cli/auth/browser.py"
      - "src/boss_agent_cli/desktop.py"
      - "src/boss_agent_cli/web/**"
      - "src/boss_agent_cli/commands/ai_config_safety.py"
      - "src/boss_agent_cli/commands/register.py"
      - "scripts/build-recruiter-exe.ps1"
      - "build-recruiter-exe.bat"
      - "tests/test_ai_config_*.py"
      - "tests/test_auth_browser.py"
      - "tests/test_auth_browser_channels.py"
      - "tests/test_recruiter_ai_config_safety.py"
      - "tests/test_recruiter_analytics_safety.py"
      - "tests/test_recruiter_desktop.py"
      - "tests/test_recruiter_exe_packaging.py"
      - "tests/test_recruiter_request_boundary.py"
      - "tests/test_recruiter_web_guided_setup.py"
      - ".github/workflows/windows-recruiter-boundaries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-recruiter-boundaries:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Windows recruiter boundary regressions
        run: >-
          uv run pytest -q
          tests/test_ai_config.py
          tests/test_ai_config_migration.py
          tests/test_ai_config_validation.py
          tests/test_ai_config_recovery.py
          tests/test_auth_browser.py
          tests/test_auth_browser_channels.py
          tests/test_recruiter_ai_config_safety.py
          tests/test_recruiter_analytics_safety.py
          tests/test_recruiter_desktop.py
          tests/test_recruiter_exe_packaging.py
          tests/test_recruiter_host_safety.py
          tests/test_recruiter_request_boundary.py
          tests/test_recruiter_web_guided_setup.py

      - name: Import recruiter Web surface
        run: >-
          uv run python -c
          "from pathlib import Path; from boss_agent_cli.web import RecruiterWebController, build_server;
          c=RecruiterWebController(Path('.ci-recruiter-boundary-data')); s,a=build_server(c, port=0);
          print('boundary server port:', s.server_port); a.tasks.close(); s.server_close()"

  windows-desktop-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Parse desktop builder
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/build-recruiter-exe.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Desktop PowerShell builder did not parse"
          }

      - name: Build desktop EXE package
        shell: pwsh
        run: ./scripts/build-recruiter-exe.ps1

      - name: Verify desktop release layout
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/BossRecruitAI-v*-win64/BossRecruitAI.exe" | Select-Object -First 1
          $zip = Get-ChildItem "dist/BossRecruitAI-v*-win64.zip" | Select-Object -First 1
          if (-not $exe) { throw "BossRecruitAI.exe missing" }
          if (-not $zip) { throw "Desktop ZIP missing" }
          if ($exe.Length -le 0 -or $zip.Length -le 0) { throw "Desktop artifacts are empty" }
          Write-Host "EXE: $($exe.FullName) ($($exe.Length) bytes)"
          Write-Host "ZIP: $($zip.FullName) ($($zip.Length) bytes)"
