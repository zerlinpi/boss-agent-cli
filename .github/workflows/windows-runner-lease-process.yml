name: Windows Runner Lease Process

on:
  push:
    branches: [master]
    paths:
      - "src/boss_agent_cli/automation/runner_lease.py"
      - "tests/test_automation_runner_lease_process.py"
      - ".github/workflows/windows-runner-lease-process.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/boss_agent_cli/automation/runner_lease.py"
      - "tests/test_automation_runner_lease_process.py"
      - ".github/workflows/windows-runner-lease-process.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lease-process:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run pytest -q tests/test_automation_runner_lease_process.py
