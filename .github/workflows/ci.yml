name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  p0_quality_gate:
    name: P0 quality baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run P0 quality baseline
        run: uv run python scripts/quality_baseline.py

      - name: P0 smoke contract (offline)
        env:
          BOSS_SMOKE_DRY_RUN: "1"
        run: uv run python scripts/smoke_p0.py

      - name: MCP eval scenarios (offline fixtures)
        run: uv run python evals/run_eval.py --mode fixture --results-dir "${RUNNER_TEMP}/evals"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --tb=short --cov=boss_agent_cli --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          # 公开仓库支持 tokenless 上传，token 配置后可获得完整功能
          # 若 secret 缺失，action 会降级为 tokenless，不阻塞 CI

      - name: Verify CLI loads
        run: uv run python -c "from boss_agent_cli.main import cli; print('CLI loaded')"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Compile check all modules
        run: uv run python -m compileall src/boss_agent_cli/ -q

      - name: Ruff lint
        run: uv run ruff check src/

      - name: Check critical imports
        run: |
          uv run python -c "
          from boss_agent_cli.auth.manager import AuthManager
          from boss_agent_cli.api.client import BossClient
          from boss_agent_cli.cache.store import CacheStore
          from boss_agent_cli.commands.schema import schema_cmd
          from boss_agent_cli.web import RecruiterWebController, build_server
          print('All critical imports OK')
          "

  typecheck:
    runs-on: ubuntu-latest
    # 静态类型检查：baseline 已清零，切为 blocking
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run mypy
        run: uv run mypy src/boss_agent_cli

  windows:
    name: Windows recruiter baseline
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Parse Windows one-click PowerShell launchers
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/start-recruiter-web.ps1",
            "scripts/start-recruiter-docker.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parse failed: $script"
            }
          }

      - name: Run Windows-sensitive recruiter tests
        run: >-
          uv run pytest -q
          tests/test_auth.py
          tests/test_auth_login_hardening.py
          tests/test_auth_persistence_hardening.py
          tests/test_auth_refresh_lock.py
          tests/test_ai_config.py
          tests/test_ai_config_migration.py
          tests/test_api_response_boundaries.py
          tests/test_recruiter_container_auth.py
          tests/test_recruiter_container_identity.py
          tests/test_recruiter_web_upload_identity.py
          tests/test_zhilian_reliability.py

      - name: Build recruiter Web server on Windows
        run: >-
          uv run python -c
          "from pathlib import Path; from boss_agent_cli.web import RecruiterWebController, build_server;
          c=RecruiterWebController(Path('.ci-recruiter-data')); s,a=build_server(c, port=0);
          print('Windows recruiter server port:', s.server_port); a.tasks.close(); s.server_close()"

  docker:
    # CLI/MCP 与招聘 Web 都必须构建；避免新的一键启动镜像在未被 CI 使用时静默腐烂。
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate recruiter compose file
        env:
          BOSS_WEB_PORT: "18765"
        run: docker compose -f docker-compose.recruiter.yml config >/dev/null

      - name: Build CLI/MCP image
        run: docker build -t boss-agent-cli:ci .

      - name: Verify the CLI entry point and JSON envelope
        run: |
          docker run --rm --entrypoint boss boss-agent-cli:ci --version
          docker run --rm --entrypoint boss boss-agent-cli:ci --json schema --format native \
            | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['ok'], d; print('schema commands:', len(d['data']['commands']))"

      - name: Verify the MCP server handshake over stdio
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}' \
            | docker run --rm -i boss-agent-cli:ci \
            | python3 -c "import sys, json; d = json.loads(sys.stdin.readline()); assert d['result']['serverInfo']['name'] == 'boss-agent-cli', d; print('MCP initialize ok')"

      - name: Verify CLI/MCP image runs as non-root
        run: test "$(docker run --rm --entrypoint id boss-agent-cli:ci -u)" != "0"

      - name: Build recruiter Web image
        run: docker build -f Dockerfile.recruiter-web -t boss-recruit-ai:ci .

      - name: Verify recruiter Web image runs as non-root
        run: test "$(docker run --rm --entrypoint id boss-recruit-ai:ci -u)" != "0"

      - name: Smoke test recruiter Web image
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d -p 127.0.0.1:18765:8765 boss-recruit-ai:ci)"
          cleanup() { docker rm -f "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18765/ >/tmp/recruiter-home.html; then
              break
            fi
            if ! docker inspect "$container_id" --format '{{.State.Running}}' | grep -q true; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:18765/ >/tmp/recruiter-home.html
          grep -q 'BOSS' /tmp/recruiter-home.html
          curl --fail --silent --show-error http://127.0.0.1:18765/app.js >/tmp/recruiter-app.js
          token="$(python3 -c "import re; t=open('/tmp/recruiter-app.js', encoding='utf-8').read(); m=re.search(r'const TOKEN = \\"([^\\"]+)\\";', t); assert m and m.group(1) != '__BOSS_WEB_TOKEN__'; print(m.group(1))")"
          curl --fail --silent --show-error \
            -H "X-Boss-Web-Token: $token" \
            http://127.0.0.1:18765/api/bootstrap >/tmp/recruiter-bootstrap.json
          python3 -c "import json; d=json.load(open('/tmp/recruiter-bootstrap.json')); assert d['ok'], d; assert 'auth' in d['data']; assert 'ai' in d['data']; assert 'tasks' in d['data']; print('recruiter bootstrap ok')"

          for attempt in $(seq 1 20); do
            health="$(docker inspect "$container_id" --format '{{.State.Health.Status}}')"
            if [ "$health" = "healthy" ]; then
              break
            fi
            if [ "$health" = "unhealthy" ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect "$container_id" --format '{{.State.Health.Status}}')" = "healthy"
