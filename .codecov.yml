# Codecov Configuration

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: false
    patch:
      default:
        target: 80%
        threshold: 5%
        # 新增/修改的代码必须自带覆盖。此前是 informational: true，等于新代码
        # 低覆盖不会有任何信号——commands/crawl.py 就是这样以 49% 合进主干的。
        #
        # 注意效力边界：codecov 的状态**不在**分支保护的必需检查里，所以这里
        # 只是把 PR 上的信号从灰变红，不会硬阻塞合并。刻意不加进必需检查——
        # ci.yml 的上传用了 fail_ci_if_error: false，上传失败时状态根本不会
        # 上报，设为必需会让 PR 永久卡在 pending。
        informational: false

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "tests/"
  - "docs/"
  - "mcp-server/"
  - "scripts/"
  # daemon 的 aiohttp + WebSocket 长驻主循环仍需要真实并发连接生命周期；
  # PID / start / stop 的确定性进程管理已由单测覆盖。其余两条浏览器边界可用
  # fake page / CDP / httpx 做行为级测试，因此不再整体排除覆盖率统计。
  - "src/boss_agent_cli/bridge/daemon.py"
